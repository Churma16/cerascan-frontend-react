name: Deploy Frontend

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Image and Deploy to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VITE_MIDTRANS_CLIENT_KEY=${{ secrets.MIDTRANS_CLIENT_KEY }}
          tags: |
            ghcr.io/churma16/cerascan-frontend-react:${{ github.sha }}
            ghcr.io/churma16/cerascan-frontend-react:latest

      - name: Activate Service on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: "ghcr.io/churma16/cerascan-frontend-react:${{ github.sha }}"
        with:
          envs: IMAGE_TAG
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            DEPLOY_PATH="/root/cerascan-deployment"
            if [ -d "$DEPLOY_PATH/scripts" ]; then
              cd "$DEPLOY_PATH"
              ./scripts/deploy.sh frontend "$IMAGE_TAG"
              ./scripts/smoke-test.sh frontend
            else
              echo "[info] $DEPLOY_PATH not yet cloned on VPS. Skipping container restart until infra is deployed."
            fi
